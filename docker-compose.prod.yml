# Production-shaped stack: one Postgres, one API container, one web container.
# Usage:
#   JWT_ACCESS_SECRET=<random> docker compose -f docker-compose.prod.yml up -d --build
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: neriva
      POSTGRES_USER: neriva
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-neriva}
    volumes:
      - pgdata-prod:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U neriva -d neriva']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      target: api
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://neriva:${POSTGRES_PASSWORD:-neriva}@postgres:5432/neriva
      RUN_MIGRATIONS: 'true'
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-30d}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
    ports:
      - '3001:3001'
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      target: web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    ports:
      - '3000:3000'
    depends_on:
      - api

volumes:
  pgdata-prod:
