info:
  title: Neriva API
  description: Headless-first CMS REST API. Success responses use a { data, meta }
    envelope; errors are RFC 7807 problem+json. URL ids accept a UUID or
    erc:<externalReferenceCode>.
  version: 0.1.0
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    AuthTokensDto:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        mustChangePassword:
          type: boolean
          description: When true, every request except password change and logout returns
            403
      required:
        - accessToken
        - refreshToken
        - mustChangePassword
    LoginDto:
      type: object
      properties:
        email:
          type: string
          format: email
          example: admin@neriva.com
        password:
          type: string
      required:
        - email
        - password
    RefreshDto:
      type: object
      properties:
        refreshToken:
          type: string
      required:
        - refreshToken
    LogoutDto:
      type: object
      properties:
        refreshToken:
          type: string
      required:
        - refreshToken
    ChangePasswordDto:
      type: object
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 8
      required:
        - currentPassword
        - newPassword
    PublicUserDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        externalReferenceCode:
          type: string
        tenantId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          type:
            - object
            - "null"
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
        mustChangePassword:
          type: boolean
        customFields:
          type: object
          additionalProperties: true
      required:
        - id
        - externalReferenceCode
        - tenantId
