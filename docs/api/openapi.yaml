  version: 0.1.0
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    AuthTokensDto:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        mustChangePassword:
          type: boolean
          description: When true, every request except password change and logout returns
            403
      required:
        - accessToken
        - refreshToken
        - mustChangePassword
    LoginDto:
      type: object
      properties:
        email:
          type: string
          format: email
          example: admin@neriva.com
        password:
          type: string
      required:
        - email
        - password
    RefreshDto:
      type: object
      properties:
        refreshToken:
          type: string
      required:
        - refreshToken
    LogoutDto:
      type: object
      properties:
        refreshToken:
          type: string
      required:
        - refreshToken
    ChangePasswordDto:
      type: object
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 8
      required:
        - currentPassword
        - newPassword
    PublicUserDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        externalReferenceCode:
          type: string
        tenantId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          type:
            - object
            - "null"
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
        mustChangePassword:
          type: boolean
        customFields:
          type: object
          additionalProperties: true
      required:
        - id
        - externalReferenceCode
        - tenantId
        - createdAt
        - updatedAt
        - createdBy
        - email
        - displayName
        - mustChangePassword
        - customFields
    PermissionDto:
      type: object
      properties:
        resourceType:
          type: string
          example: page
          description: Resource type, or '*' for all
        action:
          type: string
          example: create
          description: create/read/update/delete/publish, or '*'
      required:
        - resourceType
        - action
    RoleDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        externalReferenceCode:
          type: string
        tenantId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          type:
            - object
            - "null"
          format: uuid
        name:
          type: string
        description:
          type:
            - object
            - "null"
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/PermissionDto"
      required:
        - id
        - externalReferenceCode
        - tenantId
        - createdAt
        - updatedAt
        - createdBy
        - name
        - description
        - permissions
    CreateRoleDto:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        externalReferenceCode:
          type: string
          description: Stable code for idempotent upsert; generated when omitted
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/PermissionDto"
      required:
        - name
    UpdateRoleDto:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        permissions:
          description: Replaces the full permission set
          type: array
          items:
            $ref: "#/components/schemas/PermissionDto"
    CreateUserDto:
      type: object
      properties:
        email:
          type: string
          format: email
        displayName:
          type: string
        password:
          type: string
          minLength: 8
          description: Temporary password; a change is forced on first login
        externalReferenceCode:
          type: string
          description: Stable code for idempotent upsert; generated when omitted
        roleIds:
          type: array
          items:
            type: string
            format: uuid
      required:
        - email
        - displayName
        - password
    UpdateUserDto:
      type: object
      properties:
        email:
          type: string
          format: email
        displayName:
          type: string
    AssignRoleDto:
      type: object
      properties:
        roleId:
          type: string
          format: uuid
      required:
        - roleId
    SiteDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        externalReferenceCode:
          type: string
        tenantId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          type:
            - object
            - "null"
          format: uuid
        name:
          type: string
        slug:
          type: string
        description:
          type:
            - object
            - "null"
        customFields:
          type: object
          additionalProperties: true
      required:
        - id
        - externalReferenceCode
        - tenantId
        - createdAt
        - updatedAt
        - createdBy
        - name
        - slug
        - description
        - customFields
    CreateSiteDto:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        slug:
          type: string
          maxLength: 100
          pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
          description: Unique per tenant; normalized to lowercase
          example: main-site
        description:
          type: string
        externalReferenceCode:
          type: string
          description: Stable code for idempotent upsert; generated when omitted
      required:
        - name
        - slug
    UpdateSiteDto:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        slug:
          type: string
          maxLength: 100
          pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
          description: Unique per tenant; normalized to lowercase
        description:
          type:
            - string
            - "null"
    PageDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        externalReferenceCode:
          type: string
        tenantId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          type:
            - object
            - "null"
          format: uuid
        status:
          type: string
          enum:
            - DRAFT
            - PUBLISHED
            - ARCHIVED
        siteId:
          type: string
          format: uuid
        title:
          type: string
        path:
          type: string
          description: Unique per site, ^/[a-z0-9/-]*$
        tree:
          type: object
          additionalProperties: true
          description: "Recursive tree of block instances: { blocks: [...] }"
        customFields:
          type: object
          additionalProperties: true
      required:
        - id
        - externalReferenceCode
        - tenantId
        - createdAt
        - updatedAt
        - createdBy
        - status
        - siteId
        - title
        - path
        - tree
        - customFields
    CreatePageDto:
      type: object
      properties:
        title:
          type: string
          maxLength: 255
          example: Home
        path:
          type: string
          maxLength: 255
          pattern: ^\/[a-z0-9/-]*$
          description: Unique per site
          example: /home
        tree:
          type: object
          additionalProperties: true
          description: "Recursive tree of block instances: { blocks: [{ block: <block
            ERC>, props, slots }] }. Validated against each referenced block
            definition on every write."
          example:
            blocks:
              - block: hero-banner
                props:
                  title: Welcome
                slots:
                  main:
                    - block: text
                      props:
                        body: Hello
          default:
            blocks: []
        externalReferenceCode:
          type: string
          description: Stable code for idempotent upsert; generated when omitted
      required:
        - title
        - path
    UpdatePageDto:
      type: object
      properties:
        title:
          type: string
          maxLength: 255
        path:
          type: string
          maxLength: 255
          pattern: ^\/[a-z0-9/-]*$
          description: Unique per site
        tree:
          type: object
          additionalProperties: true
          description: "Recursive tree of block instances: { blocks: [{ block: <block
            ERC>, props, slots }] }. Validated against each referenced block
            definition on every write."
          example:
            blocks:
              - block: hero-banner
                props:
                  title: Welcome
                slots:
                  main:
                    - block: text
                      props:
                        body: Hello
    BlockSlotDto:
      type: object
      properties:
        name:
          type: string
          example: main
          description: Unique slot name, ^[a-z][a-z0-9-]*$
        allowedBlocks:
          description: Block ERCs allowed in this slot; unrestricted when omitted
          type: array
          items:
            type: string
      required:
        - name
    BlockDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        externalReferenceCode:
          type: string
        tenantId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          type:
            - object
            - "null"
          format: uuid
        status:
          type: string
          enum:
            - DRAFT
            - PUBLISHED
            - ARCHIVED
        name:
          type: string
        category:
          type:
            - object
            - "null"
        description:
          type:
            - object
            - "null"
        propsSchema:
          type: object
          additionalProperties: true
          description: JSON Schema (draft 2020-12) of the configurable props
        slots:
          type: array
          items:
            $ref: "#/components/schemas/BlockSlotDto"
      required:
        - id
        - externalReferenceCode
        - tenantId
        - createdAt
        - updatedAt
        - createdBy
        - status
        - name
        - category
        - description
        - propsSchema
        - slots
    CreateBlockDto:
      type: object
      properties:
        name:
          type: string
          example: Hero Banner
        category:
          type: string
          example: content
        description:
          type: string
        propsSchema:
          type: object
          additionalProperties: true
          description: JSON Schema (draft 2020-12) describing the configurable props
          example:
            type: object
            properties:
              title:
                type: string
        slots:
          description: Named slots, defaults to []
          type: array
          items:
            $ref: "#/components/schemas/BlockSlotDto"
        externalReferenceCode:
          type: string
          description: Stable code for idempotent upsert; generated when omitted
      required:
        - name
        - propsSchema
    UpdateBlockDto:
      type: object
      properties:
        name:
          type: string
        category:
          type: string
        description:
          type: string
        propsSchema:
          type: object
          additionalProperties: true
          description: JSON Schema (draft 2020-12) describing the configurable props
        slots:
          description: Replaces the full slot list
          type: array
          items:
            $ref: "#/components/schemas/BlockSlotDto"
    ContentFieldDto:
      type: object
      properties:
        key:
          type: string
          pattern: ^[a-z][a-zA-Z0-9]*$
          example: headline
        label:
          type: string
          example: Headline
        type:
          type: string
          enum:
            - text
            - richtext
            - number
            - boolean
            - date
        required:
          type: boolean
          default: false
      required:
        - key
        - label
        - type
    ContentTypeDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        externalReferenceCode:
          type: string
        tenantId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          type:
            - object
            - "null"
          format: uuid
        name:
          type: string
        description:
          type:
            - object
            - "null"
        fields:
          type: array
          items:
            $ref: "#/components/schemas/ContentFieldDto"
      required:
        - id
        - externalReferenceCode
        - tenantId
        - createdAt
        - updatedAt
        - createdBy
        - name
        - description
        - fields
    CreateContentTypeDto:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        description:
          type: string
        externalReferenceCode:
          type: string
          description: Stable code for idempotent upsert; generated when omitted
        fields:
          type: array
          items:
            $ref: "#/components/schemas/ContentFieldDto"
      required:
        - name
        - fields
    UpdateContentTypeDto:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        description:
          type: string
        fields:
          description: Replaces the full field list
          type: array
          items:
            $ref: "#/components/schemas/ContentFieldDto"
    ContentEntryDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        externalReferenceCode:
          type: string
        tenantId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          type:
            - object
            - "null"
          format: uuid
        status:
          type: string
          enum:
            - DRAFT
            - PUBLISHED
            - ARCHIVED
        contentTypeId:
          type: string
          format: uuid
        siteId:
          type:
            - object
            - "null"
          format: uuid
          description: null = tenant-wide entry
        title:
          type: string
        values:
          type: object
          additionalProperties: true
        customFields:
          type: object
          additionalProperties: true
      required:
        - id
        - externalReferenceCode
        - tenantId
        - createdAt
        - updatedAt
        - createdBy
        - status
        - contentTypeId
        - siteId
        - title
        - values
        - customFields
    CreateContentEntryDto:
      type: object
      properties:
        contentType:
          type: string
          description: "Content type reference: UUID or erc:<externalReferenceCode>"
        site:
          type: string
          description: "Site reference: UUID or erc:<externalReferenceCode>; omitted =
            tenant-wide entry"
        title:
          type: string
          maxLength: 255
        values:
          type: object
          additionalProperties: true
          description: Field values keyed by the content type field keys
        externalReferenceCode:
          type: string
          description: Stable code for idempotent upsert; generated when omitted
      required:
        - contentType
        - title
        - values
    UpdateContentEntryDto:
      type: object
      properties:
        title:
          type: string
          maxLength: 255
        values:
          type: object
          additionalProperties: true
          description: Replaces the full values payload; validated against the content
            type fields
        site:
          type:
            - object
            - "null"
          description: "Site reference: UUID or erc:<externalReferenceCode>; null detaches
            the entry to tenant-wide"
    DeliveredBlockSlotDto:
      type: object
      properties:
        name:
          type: string
        allowedBlocks:
          type: array
          items:
            type: string
      required:
        - name
    DeliveredBlockDto:
      type: object
      properties:
        name:
          type: string
        category:
          type:
            - string
            - "null"
        slots:
          type: array
          items:
            $ref: "#/components/schemas/DeliveredBlockSlotDto"
      required:
        - name
        - category
        - slots
    DeliveredSiteDto:
      type: object
      properties:
        name:
          type: string
        slug:
          type: string
      required:
        - name
        - slug
    DeliveredPageDto:
      type: object
      properties:
        title:
          type: string
        path:
          type: string
        tree:
          type: object
          additionalProperties: true
          description: "Recursive tree of block instances: { blocks: [...] }"
        updatedAt:
          type: string
          format: date-time
      required:
        - title
        - path
        - tree
        - updatedAt
    DeliveredPageViewDto:
      type: object
      properties:
        site:
          $ref: "#/components/schemas/DeliveredSiteDto"
        page:
          $ref: "#/components/schemas/DeliveredPageDto"
        blocks:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/DeliveredBlockDto"
          description: Map of block ERC to its definition, for every block referenced in
            the tree
      required:
        - site
        - page
        - blocks
    DeliveredPageListItemDto:
      type: object
      properties:
        title:
          type: string
        path:
          type: string
        updatedAt:
          type: string
          format: date-time
      required:
        - title
        - path
        - updatedAt
    SystemSettingDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        externalReferenceCode:
          type: string
        tenantId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          type:
            - object
            - "null"
          format: uuid
        key:
          type: string
          example: site.name
          description: Unique per tenant, pattern ^[a-z][a-z0-9.-]*$
        value:
          type: object
          description: Any JSON value
      required:
        - id
        - externalReferenceCode
        - tenantId
        - createdAt
        - updatedAt
        - createdBy
        - key
        - value
    UpsertSystemSettingDto:
      type: object
      properties:
        value:
          type: object
          description: Any JSON value (object, array, string, number, boolean)
      required:
        - value
    MediaFolderDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        externalReferenceCode:
          type: string
        tenantId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          type:
            - object
            - "null"
          format: uuid
        name:
          type: string
        parentId:
          type:
            - object
            - "null"
          format: uuid
          description: null = library root
        siteId:
          type:
            - object
            - "null"
          format: uuid
          description: Set when this is a site default folder
      required:
        - id
        - externalReferenceCode
        - tenantId
        - createdAt
        - updatedAt
        - createdBy
        - name
        - parentId
        - siteId
    CreateMediaFolderDto:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        parent:
          type: string
          description: Parent folder (UUID or erc:<externalReferenceCode>); omit for the
            root
        externalReferenceCode:
          type: string
          description: Stable code for idempotent upsert; generated when omitted
      required:
        - name
    UpdateMediaFolderDto:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        parent:
          type:
            - object
            - "null"
          description: New parent folder (UUID or erc:<externalReferenceCode>); null moves
            to the root
    MediaFileDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        externalReferenceCode:
          type: string
        tenantId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          type:
            - object
            - "null"
          format: uuid
        folderId:
          type:
            - object
            - "null"
          format: uuid
          description: null = library root
        fileName:
          type: string
        contentType:
          type: string
        sizeBytes:
          type: number
        alt:
          type:
            - object
            - "null"
          description: Accessibility text for images
        url:
          type: string
          description: "Public content URL: /public/media/<id>/<fileName>"
        customFields:
          type: object
          additionalProperties: true
      required:
        - id
        - externalReferenceCode
        - tenantId
        - createdAt
        - updatedAt
        - createdBy
        - folderId
        - fileName
        - contentType
        - sizeBytes
        - alt
        - url
        - customFields
    UpdateMediaFileDto:
      type: object
      properties:
        fileName:
          type: string
          maxLength: 255
          description: Display name; sanitized on save
        alt:
          type:
            - object
            - "null"
          maxLength: 500
        folderId:
          type:
            - object
            - "null"
          description: Target folder (UUID or erc:<externalReferenceCode>); null moves to
            the root
    ObjectFieldDto:
      type: object
      properties:
        key:
          type: string
          pattern: ^[a-z][a-zA-Z0-9]*$
          example: firstName
        label:
          type: string
          example: First name
        type:
          type: string
          enum:
            - text
            - number
            - boolean
            - date
            - picklist
        required:
          type: boolean
        options:
          description: Allowed values; picklist fields only
          type: array
          items:
            type: string
      required:
        - key
        - label
        - type
        - required
    ObjectDefinitionDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        externalReferenceCode:
          type: string
        tenantId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          type:
            - object
            - "null"
          format: uuid
        name:
          type: string
        pluralName:
          type: string
        description:
          type:
            - object
            - "null"
        fields:
          type: array
          items:
            $ref: "#/components/schemas/ObjectFieldDto"
      required:
        - id
        - externalReferenceCode
        - tenantId
        - createdAt
        - updatedAt
        - createdBy
        - name
        - pluralName
        - description
        - fields
    CreateObjectDefinitionDto:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        pluralName:
          type: string
          maxLength: 255
        description:
          type: string
        externalReferenceCode:
          type: string
          description: Stable code for idempotent upsert; generated when omitted
        fields:
          type: array
          items:
            $ref: "#/components/schemas/ObjectFieldDto"
      required:
        - name
        - pluralName
        - fields
    UpdateObjectDefinitionDto:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        pluralName:
          type: string
          maxLength: 255
        description:
          type: string
        fields:
          description: Replaces the full field list
          type: array
          items:
            $ref: "#/components/schemas/ObjectFieldDto"
    ObjectRecordDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        externalReferenceCode:
          type: string
        tenantId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          type:
            - object
            - "null"
          format: uuid
        objectDefinitionId:
          type: string
          format: uuid
        data:
          type: object
          additionalProperties: true
      required:
        - id
        - externalReferenceCode
        - tenantId
        - createdAt
        - updatedAt
        - createdBy
        - objectDefinitionId
        - data
    CreateObjectRecordDto:
      type: object
      properties:
        externalReferenceCode:
          type: string
          description: Stable code for idempotent upsert; generated when omitted
        data:
          type: object
          additionalProperties: true
          description: Field values keyed by the definition field keys
      required:
        - data
    UpdateObjectRecordDto:
      type: object
      properties:
        data:
          type: object
          additionalProperties: true
          description: Replaces the full data payload; validated against the definition
            fields
    StyleBookDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        externalReferenceCode:
          type: string
        tenantId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
