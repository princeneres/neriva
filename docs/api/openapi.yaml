info:
  title: Neriva API
  description: Headless-first CMS REST API. Success responses use a { data, meta }
    envelope; errors are RFC 7807 problem+json. URL ids accept a UUID or
    erc:<externalReferenceCode>.
  version: 0.1.0
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    AuthTokensDto:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        mustChangePassword:
          type: boolean
          description: When true, every request except password change and logout returns
            403
      required:
        - accessToken
        - refreshToken
        - mustChangePassword
    LoginDto:
      type: object
      properties:
        email:
          type: string
          format: email
          example: admin@neriva.com
        password:
          type: string
      required:
        - email
        - password
    RefreshDto:
      type: object
      properties:
        refreshToken:
          type: string
      required:
        - refreshToken
    LogoutDto:
      type: object
      properties:
        refreshToken:
          type: string
      required:
        - refreshToken
    ChangePasswordDto:
      type: object
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 8
      required:
        - currentPassword
        - newPassword
    PublicUserDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        externalReferenceCode:
          type: string
        tenantId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          type:
            - object
            - "null"
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
        mustChangePassword:
          type: boolean
        customFields:
          type: object
          additionalProperties: true
      required:
        - id
        - externalReferenceCode
        - tenantId
        - createdAt
        - updatedAt
        - createdBy
        - email
        - displayName
        - mustChangePassword
        - customFields
    PermissionDto:
      type: object
      properties:
        resourceType:
          type: string
          example: page
          description: Resource type, or '*' for all
        action:
          type: string
          example: create
          description: create/read/update/delete/publish, or '*'
      required:
        - resourceType
        - action
    RoleDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        externalReferenceCode:
          type: string
        tenantId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          type:
            - object
            - "null"
          format: uuid
        name:
          type: string
        description:
          type:
            - object
            - "null"
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/PermissionDto"
      required:
        - id
        - externalReferenceCode
        - tenantId
        - createdAt
        - updatedAt
        - createdBy
        - name
        - description
        - permissions
    CreateRoleDto:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        externalReferenceCode:
          type: string
          description: Stable code for idempotent upsert; generated when omitted
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/PermissionDto"
      required:
        - name
    UpdateRoleDto:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        permissions:
          description: Replaces the full permission set
          type: array
          items:
            $ref: "#/components/schemas/PermissionDto"
    ResourceFolderDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        externalReferenceCode:
          type: string
        tenantId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          type:
            - object
            - "null"
          format: uuid
        resource:
          type: string
          enum:
            - blocks
            - content-types
            - content-entries
            - objects
        name:
          type: string
      required:
        - id
        - externalReferenceCode
        - tenantId
        - createdAt
        - updatedAt
        - createdBy
        - resource
        - name
    CreateResourceFolderDto:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
          example: Marketing
        resource:
          type: string
          enum:
            - blocks
            - content-types
            - content-entries
            - objects
          example: blocks
        externalReferenceCode:
          type: string
          description: Stable code for idempotent upsert; generated when omitted
      required:
        - name
        - resource
    UpdateResourceFolderDto:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
      required:
        - name
    CreateUserDto:
      type: object
      properties:
        email:
          type: string
          format: email
        displayName:
          type: string
        password:
          type: string
          minLength: 8
          description: Temporary password; a change is forced on first login
        externalReferenceCode:
          type: string
          description: Stable code for idempotent upsert; generated when omitted
        roleIds:
          type: array
          items:
            type: string
            format: uuid
      required:
        - email
        - displayName
        - password
    UpdateUserDto:
      type: object
      properties:
        email:
          type: string
          format: email
        displayName:
          type: string
    AssignRoleDto:
      type: object
      properties:
        roleId:
          type: string
          format: uuid
      required:
        - roleId
    SiteDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        externalReferenceCode:
          type: string
        tenantId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          type:
            - object
            - "null"
          format: uuid
        name:
          type: string
        slug:
          type: string
        description:
          type:
            - object
            - "null"
        customFields:
          type: object
          additionalProperties: true
      required:
        - id
        - externalReferenceCode
        - tenantId
        - createdAt
        - updatedAt
        - createdBy
        - name
        - slug
        - description
        - customFields
    CreateSiteDto:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        slug:
          type: string
          maxLength: 100
          pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
          description: Unique per tenant; normalized to lowercase
          example: main-site
        description:
          type: string
        externalReferenceCode:
          type: string
          description: Stable code for idempotent upsert; generated when omitted
      required:
        - name
        - slug
    UpdateSiteDto:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        slug:
          type: string
          maxLength: 100
          pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
          description: Unique per tenant; normalized to lowercase
        description:
          type:
            - string
            - "null"
    PageTemplateDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        externalReferenceCode:
          type: string
        tenantId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          type:
            - object
            - "null"
          format: uuid
        name:
          type: string
        kind:
          type: string
          enum:
            - MASTER
