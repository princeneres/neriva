info:
  title: Neriva API
  description: Headless-first CMS REST API. Success responses use a { data, meta }
    envelope; errors are RFC 7807 problem+json. URL ids accept a UUID or
    erc:<externalReferenceCode>.
  version: 0.1.0
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    AuthTokensDto:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        mustChangePassword:
          type: boolean
          description: When true, every request except password change and logout returns
            403
      required:
        - accessToken
        - refreshToken
        - mustChangePassword
    LoginDto:
      type: object
      properties:
        email:
          type: string
          format: email
          example: admin@neriva.com
        password:
          type: string
      required:
        - email
        - password
    RefreshDto:
      type: object
      properties:
        refreshToken:
          type: string
      required:
        - refreshToken
    LogoutDto:
      type: object
      properties:
        refreshToken:
          type: string
      required:
        - refreshToken
    ChangePasswordDto:
      type: object
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 8
      required:
        - currentPassword
        - newPassword
    PublicUserDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        externalReferenceCode:
          type: string
        tenantId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          type:
            - object
            - "null"
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
        mustChangePassword:
          type: boolean
        customFields:
          type: object
          additionalProperties: true
      required:
        - id
        - externalReferenceCode
        - tenantId
        - createdAt
        - updatedAt
        - createdBy
        - email
        - displayName
        - mustChangePassword
        - customFields
    PermissionDto:
      type: object
      properties:
        resourceType:
          type: string
          example: page
          description: Resource type, or '*' for all
        action:
          type: string
          example: create
          description: create/read/update/delete/publish, or '*'
      required:
        - resourceType
        - action
    RoleDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        externalReferenceCode:
          type: string
        tenantId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          type:
            - object
            - "null"
          format: uuid
        name:
          type: string
        description:
          type:
            - object
            - "null"
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/PermissionDto"
      required:
        - id
        - externalReferenceCode
        - tenantId
        - createdAt
        - updatedAt
        - createdBy
        - name
        - description
        - permissions
    CreateRoleDto:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        externalReferenceCode:
          type: string
          description: Stable code for idempotent upsert; generated when omitted
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/PermissionDto"
      required:
        - name
    UpdateRoleDto:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        permissions:
          description: Replaces the full permission set
          type: array
          items:
            $ref: "#/components/schemas/PermissionDto"
    CreateUserDto:
      type: object
      properties:
        email:
          type: string
          format: email
        displayName:
          type: string
        password:
          type: string
          minLength: 8
          description: Temporary password; a change is forced on first login
        externalReferenceCode:
          type: string
          description: Stable code for idempotent upsert; generated when omitted
        roleIds:
          type: array
          items:
            type: string
            format: uuid
      required:
        - email
        - displayName
        - password
    UpdateUserDto:
      type: object
      properties:
        email:
          type: string
          format: email
        displayName:
          type: string
    AssignRoleDto:
      type: object
      properties:
        roleId:
          type: string
          format: uuid
      required:
        - roleId
    StyleBookDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        externalReferenceCode:
          type: string
        tenantId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          type:
            - object
            - "null"
          format: uuid
        status:
          type: string
          enum:
            - DRAFT
            - PUBLISHED
            - ARCHIVED
        name:
          type: string
        version:
          type: number
          description: Incremented on each publish
        tokens:
          type: object
          description: Flat map of token name to CSS value
          additionalProperties:
            type: string
      required:
        - id
        - externalReferenceCode
        - tenantId
        - createdAt
        - updatedAt
        - createdBy
        - status
        - name
        - version
        - tokens
    CreateStyleBookDto:
      type: object
      properties:
        name:
          type: string
        tokens:
          type: object
          description: Flat map of token name to CSS value. Names match ^[a-z][a-z0-9-]*$;
            values are non-empty strings.
          additionalProperties:
            type: string
          example:
            color-primary: "#cc3d47"
            space-4: 1rem
        externalReferenceCode:
          type: string
          description: Stable code for idempotent upsert; generated when omitted
      required:
        - name
        - tokens
    UpdateStyleBookDto:
      type: object
      properties:
        name:
          type: string
        tokens:
          type: object
          description: Flat map of token name to CSS value. Names match ^[a-z][a-z0-9-]*$;
            values are non-empty strings.
          additionalProperties:
            type: string
          example:
            color-primary: "#cc3d47"
            space-4: 1rem
