services:
  postgres:
    image: postgres:16-alpine
    container_name: neriva-postgres
    environment:
      POSTGRES_DB: neriva
      POSTGRES_USER: neriva
      POSTGRES_PASSWORD: neriva
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U neriva -d neriva']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
